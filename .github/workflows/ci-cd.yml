name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  publish-images:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image owner and repository
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repo_lower=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=$repo_lower" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.image-name.outputs.name }}-backend:${{ github.sha }}
            ghcr.io/${{ steps.image-name.outputs.name }}-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image-name.outputs.name }}-frontend:${{ github.sha }}
            ghcr.io/${{ steps.image-name.outputs.name }}-frontend:latest

  deploy:
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KUBE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"

      - name: Apply manifests and deploy images
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -f k8s/
          kubectl -n knowledge-assistant set image deployment/backend \
            backend="${IMAGE_REPOSITORY,,}-backend:${IMAGE_TAG}"
          kubectl -n knowledge-assistant set image deployment/frontend \
            frontend="${IMAGE_REPOSITORY,,}-frontend:${IMAGE_TAG}"
          kubectl -n knowledge-assistant rollout status deployment/backend --timeout=300s
          kubectl -n knowledge-assistant rollout status deployment/frontend --timeout=180s
